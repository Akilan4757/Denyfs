name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev libssl-dev libfuse3-dev pkg-config

    - name: Clean build environment
      run: make clean

    - name: Build main binary and all tests
      run: make all

    - name: Run test suite (ASan/UBSan active)
      run: make test

    - name: Verify benchmarks compile and run
      run: |
        make test_bench
        ./test_bench
